version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow_password
      POSTGRES_DB: devflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://devflow:devflow_password@db/devflow_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretkey_change_in_production
      - SMTP_HOST=smtp.example.com
      - SMTP_PORT=587
      - SMTP_USER=test
      - SMTP_PASSWORD=test
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app worker -l info
    environment:
      - DATABASE_URL=postgresql+asyncpg://devflow:devflow_password@db/devflow_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretkey_change_in_production
      - SMTP_HOST=smtp.example.com
      - SMTP_PORT=587
      - SMTP_USER=test
      - SMTP_PASSWORD=test
    depends_on:
      - db
      - redis
      - api
    volumes:
      - .:/app

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app beat -l info
    environment:
      - DATABASE_URL=postgresql+asyncpg://devflow:devflow_password@db/devflow_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

volumes:
  postgres_data:
